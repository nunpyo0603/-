<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플 정산 카드 Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: #0f1012; color: #f5f5f7; padding: 40px; display: flex; gap: 40px; justify-content: center;
            flex-wrap: wrap;
        }

        .input-panel {
            width: 380px; background: #1c1c1e; padding: 24px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            max-height: 85vh; overflow-y: auto;
        }
        .panel-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; color: #fff; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: #8e8e93; margin-bottom: 6px; font-weight: 500; }
        input[type="text"], input[type="number"], input[type="file"], select { 
            width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #2c2c2e;
            background: #2c2c2e; color: #fff; box-sizing: border-box; font-size: 13px; outline: none;
        }
        input:focus, select:focus { border-color: #0a84ff; }
        
        .day-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .btn-day-action {
            flex: 1; padding: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .btn-day-action:hover { background: rgba(255,255,255,0.15); }

        .item-input-box {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px; border-radius: 12px; margin-bottom: 12px; position: relative;
        }
        .btn-delete {
            position: absolute; right: 10px; top: 10px; background: #ff453a; color: #fff;
            border: none; border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;
        }

        .btn-add {
            width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.08); color: #0a84ff;
            border: 1px dashed #0a84ff; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 16px;
        }
        .btn-add:hover { background: rgba(10, 132, 255, 0.1); }

        .btn-export {
            width: 100%; padding: 14px; background: #0a84ff; color: white; border: none;
            border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 14px;
        }
        .btn-export:hover { background: #0071e3; }

        #cardArea {
            width: 400px; padding: 28px; border-radius: 24px;
            background: rgba(28, 28, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(30px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            box-sizing: border-box; height: fit-content;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .badge { font-size: 12px; font-weight: 600; color: #32d74b; background: rgba(50, 215, 75, 0.12); padding: 4px 10px; border-radius: 20px; }
        .card-title { font-size: 22px; font-weight: 700; color: #f5f5f7; letter-spacing: -0.5px; }

        .item-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; min-height: 40px; }
        .empty-msg { font-size: 13px; color: #636366; text-align: center; padding: 12px 0; }
        .item-row {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.04); padding: 12px 16px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .item-left { display: flex; align-items: center; gap: 12px; }
        .item-icon { width: 28px; height: 28px; object-fit: contain; border-radius: 8px; }
        .item-name { font-size: 14px; font-weight: 500; color: #e5e5ea; }
        
        .item-val { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
        .plus { color: #30d158; }
        .minus { color: #ff453a; }

        .divider { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 16px 0; }

        .summary-box {
            background: rgba(255, 255, 255, 0.03); padding: 14px 16px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 16px;
        }
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        .summary-row:last-child { margin-bottom: 0; }
        .summary-label { color: #8e8e93; font-weight: 500; }
        .summary-val { font-weight: 600; color: #f5f5f7; }

        .total-section { text-align: left; }
        .total-label { font-size: 12px; color: #8e8e93; font-weight: 500; margin-bottom: 4px; }
        .total-amount { font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: -0.8px; margin-bottom: 12px; }

        .progress-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #0a84ff, #30d158); border-radius: 4px; transition: width 0.3s; }
        .progress-text { display: flex; justify-content: space-between; font-size: 11px; color: #8e8e93; margin-top: 6px; font-weight: 500; }

        .card-footer {
            margin-top: 20px; text-align: right; font-size: 11px; color: #636366; font-weight: 500; letter-spacing: -0.2px;
        }
    </style>
</head>
<body>

    <div class="input-panel">
        <div class="panel-title">정산 데이터 세팅</div>

        <div class="input-group">
            <label>정산 일차 선택</label>
            <select id="daySelect" onchange="switchDay()"></select>
        </div>
        <div class="day-bar">
            <button class="btn-day-action" onclick="addNewDay()">+ 다음 일차 추가</button>
            <button class="btn-day-action" style="color:#ff453a;" onclick="deleteCurrentDay()">현재 일차 삭제</button>
        </div>

        <div class="input-group">
            <label>카드 제목</label>
            <input type="text" id="titleInput" placeholder="예: 1일차 정산" oninput="saveAndRender()">
        </div>

        <div class="input-group">
            <label>기존 보유 금액 (시작 메소)</label>
            <input type="number" id="initialVal" value="0" placeholder="0" oninput="saveAndRender()">
        </div>
        
        <div id="itemInputsContainer"></div>

        <button class="btn-add" onclick="addItemInput()">+ 오늘 항목 추가하기</button>

        <div class="input-group">
            <label>목표 금액 (메소)</label>
            <input type="number" id="targetVal" value="10000000000" placeholder="목표 금액" oninput="saveAndRender()">
        </div>

        <button class="btn-export" onclick="download()">PNG 이미지로 추출</button>
    </div>

    <div>
        <div id="cardArea">
            <div class="card-header">
                <div class="card-title" id="cardTitle">1일차 정산</div>
                <div class="badge">진행중</div>
            </div>

            <!-- 오늘 번 항목 목록 -->
            <div class="item-list" id="cardItemList"></div>

            <!-- 정산 요약 영역 -->
            <div class="summary-box">
                <div class="summary-row">
                    <span class="summary-label">오늘 번 금액 (수입)</span>
                    <span class="summary-val plus" id="outTodayTotal">+0 메소</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">기존 보유 금액</span>
                    <span class="summary-val" id="outInitialVal">0 메소</span>
                </div>
                <div class="summary-row" style="border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 6px; margin-top: 4px;">
                    <span class="summary-label">오늘 총 변동 차액</span>
                    <span class="summary-val" id="outDiffVal">+0 메소</span>
                </div>
            </div>

            <div class="divider"></div>

            <div class="total-section">
                <div class="total-label">최종 누적 보유 금액</div>
                <div class="total-amount" id="outTotal">0 메소</div>
                
                <div class="progress-bg">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
                <div class="progress-text">
                    <span id="outRate">달성률 0.0%</span>
                    <span id="outTarget">목표 100억</span>
                </div>
            </div>

            <div class="card-footer">
                Made by 유튜버 넌표
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "MAPLE_SETTLEMENT_CARD_PROD";
        
        const DEFAULT_ICONS = {
            solErda: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%236c5ce7'/><path d='M50 20 L65 50 L50 80 L35 50 Z' fill='%23a29bfe'/></svg>",
            mesoBag: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M30 40 Q50 20 70 40 Q80 80 50 85 Q20 80 30 40 Z' fill='%23fdcb6e'/><circle cx='50' cy='55' r='10' fill='%23ffeaa7'/></svg>"
        };

        let appState = {
            currentDayIndex: 0,
            initialVal: 0,
            targetVal: 10000000000,
            days: []
        };

        let itemIdCounter = Date.now();

        window.onload = function() {
            loadFromStorage();
            renderDaySelect();
            loadCurrentDayInputUI();
            saveAndRender();
        };

        function loadFromStorage() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    appState = JSON.parse(data);
                } catch (e) {
                    initDefaultData();
                }
            } else {
                initDefaultData();
            }
        }

        function initDefaultData() {
            appState = {
                currentDayIndex: 0,
                initialVal: 0,
                targetVal: 10000000000,
                days: [
                    {
                        title: "1일차 정산",
                        items: []
                    }
                ]
            };
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        function renderDaySelect() {
            const select = document.getElementById('daySelect');
            select.innerHTML = "";
            appState.days.forEach((day, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = day.title || `${idx + 1}일차 정산`;
                if (idx === appState.currentDayIndex) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchDay() {
            const select = document.getElementById('daySelect');
            appState.currentDayIndex = Number(select.value);
            loadCurrentDayInputUI();
            saveAndRender();
        }

        function addNewDay() {
            const newDayNum = appState.days.length + 1;
            appState.days.push({
                title: `${newDayNum}일차 정산`,
                items: []
            });
            appState.currentDayIndex = appState.days.length - 1;
            renderDaySelect();
            loadCurrentDayInputUI();
            saveAndRender();
        }

        function deleteCurrentDay() {
            if (appState.days.length <= 1) {
                alert("최소 1개의 일차 데이터는 존재해야 합니다.");
                return;
            }
            appState.days.splice(appState.currentDayIndex, 1);
            if (appState.currentDayIndex >= appState.days.length) {
                appState.currentDayIndex = appState.days.length - 1;
            }
            renderDaySelect();
            loadCurrentDayInputUI();
            saveAndRender();
        }

        function loadCurrentDayInputUI() {
            const curDay = appState.days[appState.currentDayIndex];
            document.getElementById('titleInput').value = curDay.title;
            document.getElementById('initialVal').value = appState.initialVal || 0;
            document.getElementById('targetVal').value = appState.targetVal;

            const container = document.getElementById('itemInputsContainer');
            container.innerHTML = "";

            curDay.items.forEach(item => {
                createItemInputBox(item);
            });
        }

        function createItemInputBox(item) {
            const container = document.getElementById('itemInputsContainer');
            const box = document.createElement('div');
            box.className = 'item-input-box';
            box.id = `inputBox_${item.id}`;
            box.innerHTML = `
                <button class="btn-delete" onclick="removeItemInput(${item.id})">삭제</button>
                <div class="input-group" style="margin-bottom:6px;">
                    <label>아이콘 선택</label>
                    <select onchange="updateItemIconType(${item.id}, this.value)">
                        <option value="mesoBag" ${item.iconType === 'mesoBag' ? 'selected' : ''}>기본: 사냥 돈주머니</option>
                        <option value="solErda" ${item.iconType === 'solErda' ? 'selected' : ''}>기본: 솔에르다 조각</option>
                        <option value="custom" ${item.iconType === 'custom' ? 'selected' : ''}>직접 커스텀 이미지 업로드</option>
                    </select>
                </div>
                <div class="input-group" id="fileGroup_${item.id}" style="margin-bottom:6px; display: ${item.iconType === 'custom' ? 'block' : 'none'};">
                    <label>이미지 파일 선택</label>
                    <input type="file" accept="image/*" onchange="loadImg(event, ${item.id})">
                </div>
                <div class="input-group" style="margin-bottom:6px;">
                    <input type="text" value="${item.name}" placeholder="항목 이름 (예: 사냥 메소)" oninput="updateItemName(${item.id}, this.value)">
                </div>
                <div class="input-group" style="margin-bottom:0;">
                    <input type="number" value="${item.val || ''}" placeholder="금액 (메소)" oninput="updateItemVal(${item.id}, this.value)">
                </div>
            `;
            container.appendChild(box);
        }

        function addItemInput() {
            const curDay = appState.days[appState.currentDayIndex];
            const newItem = { id: itemIdCounter++, name: "", val: 0, iconType: "mesoBag", imgBase64: "" };
            curDay.items.push(newItem);
            createItemInputBox(newItem);
            saveAndRender();
        }

        function removeItemInput(id) {
            const curDay = appState.days[appState.currentDayIndex];
            const idx = curDay.items.findIndex(i => i.id === id);
            if (idx !== -1) {
                curDay.items.splice(idx, 1);
                const el = document.getElementById(`inputBox_${id}`);
                if (el) el.remove();
                saveAndRender();
            }
        }

        function updateItemIconType(id, type) {
            const curDay = appState.days[appState.currentDayIndex];
            const item = curDay.items.find(i => i.id === id);
            if (item) {
                item.iconType = type;
                const fileGroup = document.getElementById(`fileGroup_${id}`);
                if (fileGroup) fileGroup.style.display = (type === 'custom') ? 'block' : 'none';
                saveAndRender();
            }
        }

        function loadImg(e, id) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const curDay = appState.days[appState.currentDayIndex];
                    const item = curDay.items.find(i => i.id === id);
                    if (item) {
                        item.imgBase64 = evt.target.result;
                        saveAndRender();
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function updateItemName(id, val) {
            const curDay = appState.days[appState.currentDayIndex];
            const item = curDay.items.find(i => i.id === id);
            if (item) { item.name = val; saveAndRender(); }
        }

        function updateItemVal(id, val) {
            const curDay = appState.days[appState.currentDayIndex];
            const item = curDay.items.find(i => i.id === id);
            if (item) { item.val = Number(val) || 0; saveAndRender(); }
        }

        function fmt(num) {
            if (!num || num === 0) return "0 메소";
            let absNum = Math.abs(num);
            let e = Math.floor(absNum / 100000000);
            let m = Math.floor((absNum % 100000000) / 10000);
            
            let res = "";
            if (e > 0) res += e + "억 ";
            if (m > 0) res += m.toLocaleString() + "만 ";
            
            let formatted = res.trim() + " 메소";
            if (res === "") formatted = (absNum).toLocaleString() + " 메소";
            
            return num < 0 ? "-" + formatted : "+" + formatted;
        }

        function saveAndRender() {
            const curDay = appState.days[appState.currentDayIndex];
            curDay.title = document.getElementById('titleInput').value || `${appState.currentDayIndex + 1}일차 정산`;
            appState.initialVal = Number(document.getElementById('initialVal').value) || 0;
            appState.targetVal = Number(document.getElementById('targetVal').value) || 10000000000;

            saveToStorage();

            const select = document.getElementById('daySelect');
            if (select.options[appState.currentDayIndex]) {
                select.options[appState.currentDayIndex].innerText = curDay.title;
            }

            document.getElementById('cardTitle').innerText = curDay.title;

            const cardItemList = document.getElementById('cardItemList');
            cardItemList.innerHTML = "";

            let todayIncome = 0;
            if (curDay.items.length === 0) {
                cardItemList.innerHTML = `<div class="empty-msg">항목을 추가해 주세요</div>`;
            } else {
                curDay.items.forEach(item => {
                    const numVal = Number(item.val) || 0;
                    todayIncome += numVal;

                    const row = document.createElement('div');
                    row.className = 'item-row';
                    
                    let iconSrc = "";
                    if (item.iconType === "solErda") {
                        iconSrc = DEFAULT_ICONS.solErda;
                    } else if (item.iconType === "mesoBag") {
                        iconSrc = DEFAULT_ICONS.mesoBag;
                    } else if (item.iconType === "custom" && item.imgBase64) {
                        iconSrc = item.imgBase64;
                    }

                    const imgTag = iconSrc 
                        ? `<img src="${iconSrc}" class="item-icon">` 
                        : `<div style="width:28px; height:28px;"></div>`;

                    row.innerHTML = `
                        <div class="item-left">
                            ${imgTag}
                            <span class="item-name">${item.name || "항목명 미입력"}</span>
                        </div>
                        <span class="item-val ${numVal >= 0 ? 'plus' : 'minus'}">${fmt(numVal)}</span>
                    `;
                    cardItemList.appendChild(row);
                });
            }

            document.getElementById('outTodayTotal').innerText = fmt(todayIncome);

            let cumulativeIncome = 0;
            for (let i = 0; i <= appState.currentDayIndex; i++) {
                const dayItems = appState.days[i].items;
                dayItems.forEach(item => {
                    cumulativeIncome += (Number(item.val) || 0);
                });
            }

            const initialVal = appState.initialVal;
            const finalTotal = initialVal + cumulativeIncome;

            document.getElementById('outInitialVal').innerText = fmt(initialVal).replace("+", "");
            document.getElementById('outDiffVal').innerText = fmt(cumulativeIncome);
            document.getElementById('outDiffVal').className = `summary-val ${cumulativeIncome >= 0 ? 'plus' : 'minus'}`;

            const target = appState.targetVal;
            const rate = target > 0 ? ((Math.max(0, finalTotal) / target) * 100).toFixed(1) : 0;

            document.getElementById('outTotal').innerText = fmt(finalTotal).replace("+", "");
            document.getElementById('outRate').innerText = `달성률 ${rate}%`;
            document.getElementById('outTarget').innerText = `목표 ${fmt(target).replace("+", "")}`;
            document.getElementById('progressFill').style.width = `${Math.min(rate, 100)}%`;
        }

        function download() {
            html2canvas(document.getElementById('cardArea'), { backgroundColor: null, scale: 2 }).then(canvas => {
                let a = document.createElement('a');
                a.download = `${document.getElementById('titleInput').value || '정산'}_정산카드.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();
            });
        }
    </script>
</body>
</html>
